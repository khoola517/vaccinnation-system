<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>تسجيل الدخول - Kindred Care</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&amp;family=Noto+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {

                extend: {
                    "colors": {

                        "on-primary-fixed": "#001a43",
                        "surface-container": "#e5eeff",
                        "secondary": "#006b5f",
                        "primary-fixed-dim": "#aec6ff",
                        "on-error": "#ffffff",
                        "surface-container-highest": "#d3e4fe",
                        "on-tertiary-container": "#fffbff",
                        "secondary-fixed": "#62fae3",
                        "outline-variant": "#c2c6d6",
                        "on-error-container": "#93000a",
                        "tertiary": "#765700",
                        "on-background": "#0b1c30",
                        "surface-variant": "#d3e4fe",
                        "inverse-primary": "#aec6ff",
                        "on-tertiary-fixed": "#261a00",

                        "surface-dim": "#cbdbf5",
                        "on-secondary": "#ffffff",
                        "outline": "#727785",
                        "surface-bright": "#f8f9ff",
                        "surface-container-high": "#dce9ff",
                        "on-primary-fixed-variant": "#004397",
                        "inverse-surface": "#213145",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed-dim": "#f9bd22",
                        "on-secondary-fixed-variant": "#005047",
                        "on-surface": "#0b1c30",
                        "surface-tint": "#0059c5",
                        "background": "#f8f9ff",

                    "borderRadius": {
                        "DEFAULT": "0.25rem",

    <style>
        body { font-family: 'Noto Sans Arabic', sans-serif; }
    </style>
    <script src="script.js" defer></script>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center py-12 px-margin-mobile">
    <div class="max-w-md w-full bg-surface-container-lowest rounded-[32px] p-lg md:p-12 shadow-[0_8px_32px_rgba(42,115,232,0.08)] border border-outline-variant/30 flex flex-col items-center">
        <!-- Logo -->
        <a href="index.html" class="font-headline-md text-headline-md font-bold text-primary flex items-center gap-2 mb-8 cursor-pointer select-none">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">pediatrics</span>
            Kindred Care
        </a>
        
        <h1 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-background text-center mb-2">تسجيل الدخول</h1>
        <p class="font-body-md text-body-md text-on-surface-variant text-center mb-8">اختر دورك وسجل الدخول لإدارة تطعيمات طفلك أو جدول عملك.</p>

        <!-- Role Tabs Selector -->
        <div class="w-full flex bg-surface-container-low p-1.5 rounded-xl border border-outline-variant/40 mb-8">
            <button id="tab-parent" type="button" class="flex-1 py-3 text-center rounded-lg font-label-md text-label-md bg-primary text-on-primary shadow-sm transition-all">
                ولي أمر (مستخدم)
            </button>
            <button id="tab-staff" type="button" class="flex-1 py-3 text-center rounded-lg font-label-md text-label-md bg-surface text-on-surface-variant hover:text-on-surface hover:bg-surface-container transition-all">
                طبيب / إداري (مسؤول)
            </button>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="w-full flex flex-col gap-md">
            <!-- Email Input -->
            <div class="flex flex-col gap-2">
                <label for="login-email" class="font-label-md text-label-md text-on-surface">البريد الإلكتروني</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant">mail</span>
                    <input id="login-email" type="email" placeholder="example@domain.com" class="w-full bg-surface-container-low border border-outline-variant/60 rounded-xl pr-12 pl-4 py-3 text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" required/>
                </div>
            </div>

            <!-- Password Input -->
            <div class="flex flex-col gap-2">
                <label for="login-password" class="font-label-md text-label-md text-on-surface">كلمة المرور</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
                    <input id="login-password" type="password" placeholder="••••••••" class="w-full bg-surface-container-low border border-outline-variant/60 rounded-xl pr-12 pl-4 py-3 text-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" required/>
                </div>
            </div>

            <!-- Remember me & Forgot Password -->
            <div class="flex justify-between items-center mt-2">
                <label class="flex items-center gap-2 cursor-pointer font-body-sm text-sm text-on-surface-variant">
                    <input type="checkbox" class="rounded text-primary focus:ring-primary focus:ring-offset-0 border-outline-variant w-4 h-4"/>
                    تذكرني
                </label>
                <a href="#" class="font-label-sm text-label-sm text-primary hover:underline">نسيت كلمة المرور؟</a>
            </div>

            <!-- Submit Button -->
            <button id="login-submit-btn" type="submit" class="w-full mt-6 py-3 bg-primary hover:bg-primary/90 text-on-primary font-label-md text-label-md rounded-full shadow-sm transition-colors text-center cursor-pointer active:scale-95">
                تسجيل الدخول
            </button>
        </form>

        <p class="font-body-sm text-sm text-on-surface-variant text-center mt-8">
            ليس لديك حساب؟
            <a href="signup.html" class="font-label-sm text-label-sm text-primary hover:underline">إنشاء حساب جديد</a>
        </p>
    </div>
</body>
</html>
